name: 'Windows and macOS Wheel Builder'
description: 'Build Python wheels for Windows and macOS'

on:
  workflow_call:
    inputs:
      cibw_build:
        description: 'Python/platform wheel selectors passed to CIBW_BUILD'
        type: string
        required: false
        default: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
      cibw_archs:
        description: 'Target architectures passed to CIBW_ARCHS'
        type: string
        required: false
        default: 'auto64'
      cibw_test_command:
        description: 'Command used by cibuildwheel to test each built wheel'
        type: string
        required: false
        default: 'python -m pip check'
      cibw_environment:
        description: 'Environment assignments passed to cibuildwheel (for example, FOO=bar BAZ=qux)'
        type: string
        required: false
        default: ''
      artifact_prefix:
        description: 'Prefix for uploaded wheel artifact names'
        type: string
        required: false
        default: 'dist'

jobs:
  build_win_mac_wheels:
    name: Build Python Wheels (${{ matrix.artifact-suffix }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos
          artifact-suffix: macos
        - os: windows
          artifact-suffix: windows
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install cibuildwheel
      run: python -m pip install --upgrade cibuildwheel

    - name: Build wheels
      run: python -m cibuildwheel . --output-dir dist
      env:
        CIBW_BUILD: ${{ inputs.cibw_build }}
        CIBW_ARCHS: ${{ inputs.cibw_archs }}
        CIBW_SKIP: "*-musllinux_*"
        CIBW_TEST_COMMAND: ${{ inputs.cibw_test_command }}
        CIBW_ENVIRONMENT: ${{ inputs.cibw_environment }}

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact-suffix }}
        path: dist/*.whl
        if-no-files-found: error
